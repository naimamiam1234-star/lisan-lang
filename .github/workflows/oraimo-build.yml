name: Oraimo OpenWatch Android APK
on:
  push:
    branches:
      - build-oraimo-openwatch-20261023
    paths:
      - .github/workflows/oraimo-build.yml
      - oraimo-build/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4
      - name: Restore Android project
        run: |
          mkdir -p ${{ runner.temp }}/OraimoOpenWatch
          cat oraimo-build/v04part{1,2,3,4,5,6}.b64 | tr -d '\n' | base64 -d > ${{ runner.temp }}/openwatch-src.zip
          unzip -q ${{ runner.temp }}/openwatch-src.zip -d ${{ runner.temp }}/OraimoOpenWatch
          test -f ${{ runner.temp }}/OraimoOpenWatch/app/src/main/AndroidManifest.xml
          echo 'v0.3 includes corrected UUID formatter'
      - name: Configure JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Locate or install Android SDK command-line tools
        run: |
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1 || true)"
          if [ -z "$SDKMANAGER" ]; then
            curl -fLsS --retry 3 -o "$RUNNER_TEMP/android-tools.zip" "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
            mkdir -p "$ANDROID_HOME/cmdline-tools/latest"
            unzip -q "$RUNNER_TEMP/android-tools.zip" -d "$RUNNER_TEMP/android-tools"
            mv "$RUNNER_TEMP/android-tools/cmdline-tools/"* "$ANDROID_HOME/cmdline-tools/latest/"
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          "$SDKMANAGER" --version
      - name: Install SDK platform
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compile debug APK
        working-directory: ${{ runner.temp }}/OraimoOpenWatch
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Verify output
        run: |
          APK="${{ runner.temp }}/OraimoOpenWatch/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          ls -lh "$APK"
      - name: Publish APK
        uses: actions/upload-artifact@v4
        with:
          name: OraimoOpenWatch-v0.4-Android16-debug-APK
          path: ${{ runner.temp }}/OraimoOpenWatch/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14